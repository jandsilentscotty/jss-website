    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fd797" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c0c7d5" stop-opacity="0"/>
