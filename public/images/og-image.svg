    </g>
    <text x="86" y="42" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f3f6f7">
      J &amp; Silent Scotty
    </text>
  </g>

  <text font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3"
        fill="#ffffff" y="300"><tspan x="84" dy="0">[App Name]</tspan></text>

  <text font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400"
        fill="#a3adb5" y="392"><tspan x="84" dy="0">[App Name] is the iOS and Apple Watch training app for</tspan><tspan x="84" dy="46">lifters who want every set logged in one tap — so you can</tspan><tspan x="84" dy="46">focus on the work, not the paperwork.</tspan></text>

  <g transform="translate(84 534)" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="600">
    <rect width="14" height="14" rx="7" fill="#c6f24e" y="4"/>
    <text x="30" y="17" fill="#c6f24e">iPhone</text>
    <text x="132" y="17" fill="#4b545c">•</text>
    <text x="158" y="17" fill="#c6f24e">Apple Watch</text>
    <text x="352" y="17" fill="#4b545c">•</text>
    <text x="378" y="17" fill="#8d979f">Built by J &amp; Silent Scotty</text>
