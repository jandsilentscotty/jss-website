  <text font-family="'Hanken Grotesk', -apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400"
        fill="#c5c6cc" y="392"><tspan x="84" dy="0">RepBud is the iPhone and Apple Watch training log you can</tspan><tspan x="84" dy="46">talk to. Say “185 for 8” between sets and it is logged — on</tspan><tspan x="84" dy="46">device, no typing, no phone juggling.</tspan></text>

